server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $django http://backend:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
